name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, test and fuzz
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build applications
        run: make

      # Les invariants d'architecture sont verifies avant les tests :
      # un header Linux qui s'invite dans la couche protocole doit faire
      # echouer la CI, meme si tout le reste passe.
      - name: Check architecture invariants
        run: make check-portability

      - name: Unit tests (AddressSanitizer + UndefinedBehaviorSanitizer)
        run: make test

      - name: Parser fuzzing campaign
        run: ./build/fuzz_parser 500000 0xC0FFEE

      # L'adversaire AHDG attaque le vrai serveur UDS. Un contre-exemple non
      # couvert par une regression fait echouer la CI : c'est le garde-fou
      # qui empeche une regression de securite de passer inapercue.
      - name: Adversarial state-space exploration
        run: ./build/ahdg_explore 500000 0xA11CE

      # L'adversaire descend au niveau des trames CAN : il cherche une
      # confusion cross-layer (transport forgeant une autorite UDS) ou une
      # atteinte a la disponibilite dans le vrai pipeline isotp_rx + uds.
      - name: Frame-level cross-layer exploration
        run: ./build/ahdg_frames 300000 0xF00D

  strict-warnings:
    name: Strict warnings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Un cran au-dessus du build normal : -Werror, -Wconversion et
      # -Wshadow sur les couches protocole. Elles doivent rester propres
      # meme sous les avertissements que les applications ne subissent
      # pas encore.
      - name: Protocol layers under strict warnings
        run: |
          for f in src/isotp/*.c src/uds/*.c; do
            gcc -Wall -Wextra -Werror -Wconversion -Wshadow -Wpedantic \
                -std=c11 -Isrc/isotp -Isrc/uds -c "$f" -o /dev/null
          done

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      # Gate sur les severites substantielles (bugs potentiels reels).
      # Le 'style' de cppcheck (constVariable, variableScope) est consultatif
      # et varie d'une version a l'autre ; on ne bloque pas dessus.
      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,performance,portability \
                   --error-exitcode=1 \
                   --inline-suppr \
                   --suppress=missingIncludeSystem \
                   --std=c11 \
                   -Isrc/isotp -Isrc/uds -Isrc/ecu -Isrc/gateway -Ifuzz \
                   -Isrc/platform -Isrc/platform/socketcan \
                   src/ tests/ fuzz/ tools/ web/wasm

  integration:
    name: End-to-end over a virtual CAN bus
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install can-utils
        run: sudo apt-get update && sudo apt-get install -y can-utils

      # Les runners GitHub n'ont pas toujours le module noyau vcan. On tente
      # de creer l'interface ; si c'est impossible, on saute proprement les
      # etapes qui en dependent au lieu de faire echouer tout le workflow.
      - name: Create vcan0
        id: vcan
        run: |
          if sudo modprobe vcan 2>/dev/null \
             && sudo ip link add dev vcan0 type vcan 2>/dev/null \
             && sudo ip link set up vcan0 2>/dev/null; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            ip -details link show vcan0
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::module vcan indisponible sur ce runner ; etapes CAN sautees"
          fi

      - name: Build
        if: steps.vcan.outputs.ok == 'true'
        run: make

      # Le tester deroule le scenario complet, le fuzzer bombarde ensuite
      # le meme ECU. Le code de retour du fuzzer est ce qui compte : il
      # est non nul si une sonde de vitalite a echoue ou si une commande
      # protegee a ete acceptee.
      - name: Diagnostic scenario
        if: steps.vcan.outputs.ok == 'true'
        run: |
          ./build/ecu -q &
          ECU_PID=$!
          sleep 2
          ./build/tester
          sleep 1
          kill $ECU_PID || true

      # Le test le plus precieux du projet : nos tests unitaires
      # prouvent seulement que notre emetteur et notre recepteur se
      # comprennent. S'ils partagent la meme erreur d'interpretation,
      # ils se comprendront parfaitement. La pile du noyau est un
      # arbitre independant.
      - name: Cross-validation against the kernel ISO-TP stack
        if: steps.vcan.outputs.ok == 'true'
        run: |
          sudo modprobe can-isotp
          ./tests/interop/crossvalidate.sh

      - name: Fault injection campaign
        if: steps.vcan.outputs.ok == 'true'
        run: |
          ./build/ecu -q &
          ECU_PID=$!
          sleep 2
          ./build/fuzz_bus 400 0xBADC0DE
          kill $ECU_PID || true
